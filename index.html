<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis – Jacob Aird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FFFFFF; --text:#212121; --head:#BDE7F6; --btn:#BFE6F5; --line:#333333; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Roboto", Arial, sans-serif; font-size: 16px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--head); border-bottom: 1px solid var(--line);
    padding: 28px 16px 24px; text-align: center;
  }
  .cover {
    display: block; width: min(86vw, 400px); aspect-ratio: 1 / 1; object-fit: cover;
    margin: 0 auto 20px; background: #fff;
    border: 1px solid var(--line); border-radius: 4px;
    -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none;
  }
  h1, h2 { font-family: "Baloo 2", "Roboto", sans-serif; font-weight: 800; margin: 0; }
  h1 { font-size: clamp(2.4rem, 10vw, 3.5rem); line-height: 1; }
  .artist { margin: 6px 0 0; font-size: 1.15rem; }

  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .now { font-size: 1.5rem; line-height: 1.2; text-align: center; margin-bottom: 14px; min-height: 1.8rem; }

  .bar {
    position: relative; height: 20px; background: #fff; cursor: pointer; touch-action: none;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  }
  .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--btn); border-right: 1px solid var(--line); }
  .fill.empty { border-right: 0; }
  .times { display: flex; justify-content: space-between; margin: 6px 0 16px; font-size: .9rem; font-variant-numeric: tabular-nums; }

  .controls { display: flex; justify-content: center; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 64px; min-height: 52px; padding: 0 16px;
    background: var(--btn); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; box-shadow: none;
    font: 500 1rem "Roboto", Arial, sans-serif; text-align: center; cursor: pointer;
  }
  .btn.main { min-width: 110px; }
  .btn:active { background: var(--head); }
  .btn svg { width: 24px; height: 24px; fill: var(--text); display: block; }
  button:focus-visible, .bar:focus-visible, input:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  .status { min-height: 1.4em; margin: 12px 0 0; text-align: center; font-size: .95rem; }

  .volume { display: flex; align-items: center; gap: 12px; margin: 12px 0 28px; }
  .volume label { font-weight: 500; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  input[type=range]::-moz-range-track { height: 8px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; background: var(--btn); border: 1px solid var(--line); border-radius: 4px; }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; background: var(--btn); border: 1px solid var(--line); border-radius: 4px; }

  h2 { font-size: 1.5rem; margin-bottom: 10px; }
  ol { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  li + li { border-top: 1px solid #cfcfcf; }
  .track {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center;
    width: 100%; padding: 14px 12px; min-height: 52px;
    background: #fff; color: var(--text); border: 0; border-radius: 0; box-shadow: none;
    font: 400 1rem "Roboto", Arial, sans-serif; text-align: left; cursor: pointer;
  }
  .track .n, .track .d { font-variant-numeric: tabular-nums; }
  .track .d { font-size: .9rem; }
  .track.playing { background: var(--head); font-weight: 700; }
  .track:focus-visible { outline-offset: -3px; }
  @media (hover: hover) { .track:not(.playing):hover { background: #f3fafd; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <img class="cover" src="cover.png" alt="Genesis album cover" draggable="false">
  <h1>Genesis</h1>
  <p class="artist">Jacob Aird</p>
</header>

<main id="player">
  <h2 class="now" id="now"></h2>

  <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="fill empty" id="fill"></div>
  </div>
  <div class="times"><span id="cur">0:00</span><span id="tot">0:00</span></div>

  <div class="controls">
    <button class="btn" id="prev" aria-label="Previous track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button class="btn main" id="play" aria-label="Play">
      <svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
    </button>
    <button class="btn" id="next" aria-label="Next track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
    </button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="volume">
    <label for="vol">Volume</label>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
  </div>

  <h2>Tracks</h2>
  <ol id="list"></ol>
</main>

<script>
(function () {
  "use strict";

  var TRACKS = [
    { title: "Family Medley", len: "2:48" },
    { title: "Light of Christ (Orchestra)", len: "3:06" },
    { title: "He is the Plan", len: "4:11" },
    { title: "All Over Again", len: "4:06" },
    { title: "Heaven Medley", len: "4:51" },
    { title: "Mother I Love You", len: "0:56" },
    { title: "His Kingdom (Full Instrumental)", len: "2:48" }
  ].map(function (t, i) {
    var p = t.len.split(":");
    t.file = "track" + (i + 1) + ".mp3";
    t.secs = parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
    return t;
  });

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    now: $("now"), bar: $("bar"), fill: $("fill"), cur: $("cur"), tot: $("tot"),
    prev: $("prev"), play: $("play"), next: $("next"), icon: $("icon"),
    status: $("status"), vol: $("vol"), list: $("list")
  };
  var ICON_PLAY = "M7 4l13 8-13 8z";
  var ICON_PAUSE = "M6 4h4v16H6zM14 4h4v16h-4z";

  var audio = new Audio();          // no controls, never attached to the page
  audio.preload = "auto";
  audio.volume = parseFloat(els.vol.value);

  var cache = {};                   // index -> Promise<blob URL>
  var current = 0;                  // selected track
  var loaded = -1;                  // track whose blob is in the audio element
  var token = 0;                    // guards against out-of-order loads

  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function setStatus(msg) { els.status.textContent = msg || ""; }

  // Fetch the MP3 and hand the player a blob URL so the file URL is not exposed in the page.
  function getUrl(i) {
    if (!cache[i]) {
      var p = fetch(TRACKS[i].file)
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.blob();
        })
        .then(function (b) {
          return URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }));
        });
      p.catch(function () { delete cache[i]; });
      cache[i] = p;
    }
    return cache[i];
  }

  function buildList() {
    TRACKS.forEach(function (t, i) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "track";
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="d"></span>';
      b.children[0].textContent = i + 1;
      b.children[1].textContent = t.title;
      b.children[2].textContent = t.len;
      b.addEventListener("click", function () { select(i, true); });
      li.appendChild(b);
      els.list.appendChild(li);
    });
  }

  function render() {
    var rows = els.list.querySelectorAll(".track");
    for (var i = 0; i < rows.length; i++) {
      var on = i === current;
      rows[i].classList.toggle("playing", on);
      if (on) rows[i].setAttribute("aria-current", "true");
      else rows[i].removeAttribute("aria-current");
    }
    els.now.textContent = TRACKS[current].title;
    document.title = TRACKS[current].title + " – Genesis – Jacob Aird";
    updateTime();
  }

  function duration() {
    if (loaded === current && isFinite(audio.duration) && audio.duration > 0) return audio.duration;
    return TRACKS[current].secs;
  }

  function updateTime() {
    var pos = loaded === current ? audio.currentTime : 0;
    var dur = duration();
    var pct = Math.min(100, (pos / dur) * 100);
    els.fill.style.width = pct + "%";
    els.fill.classList.toggle("empty", pct <= 0);
    els.cur.textContent = fmt(pos);
    els.tot.textContent = fmt(dur);
    els.bar.setAttribute("aria-valuenow", Math.round(pct));
    els.bar.setAttribute("aria-valuetext", fmt(pos) + " of " + fmt(dur));
  }

  function updateButton() {
    var playing = !audio.paused && loaded === current;
    els.icon.firstElementChild.setAttribute("d", playing ? ICON_PAUSE : ICON_PLAY);
    els.play.setAttribute("aria-label", playing ? "Pause" : "Play");
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
  }

  function select(i, autoplay) {
    var my = ++token;
    current = i;
    audio.pause();
    loaded = -1;
    render();
    updateButton();
    setStatus("Loading…");
    getUrl(i).then(function (url) {
      if (my !== token) return;
      audio.src = url;
      loaded = i;
      setStatus("");
      updateTime();
      if ("mediaSession" in navigator && window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: TRACKS[i].title, artist: "Jacob Aird", album: "Genesis"
        });
      }
      if (i + 1 < TRACKS.length) getUrl(i + 1).catch(function () {});   // warm the next track
      if (autoplay) return audio.play();
    }).catch(function (e) {
      if (my !== token) return;
      if (e && e.name === "AbortError") return;
      if (e && e.name === "NotAllowedError") { setStatus("Press play to start."); updateButton(); return; }
      setStatus("This track could not be loaded. Check that track" + (i + 1) + ".mp3 is in the same folder and the page is served from a web server.");
      updateButton();
    });
  }

  function toggle() {
    if (loaded !== current) { select(current, true); return; }
    if (audio.paused) audio.play().catch(function () {});
    else audio.pause();
  }
  function next() { if (current < TRACKS.length - 1) select(current + 1, true); }
  function prev() {
    if (loaded === current && audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (current > 0) select(current - 1, true);
    else if (loaded === current) audio.currentTime = 0;
  }

  // Seeking: click or drag the bar
  function seekFromEvent(e) {
    if (loaded !== current) return;
    var r = els.bar.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    audio.currentTime = ratio * duration();
    updateTime();
  }
  var dragging = false;
  els.bar.addEventListener("pointerdown", function (e) {
    dragging = true;
    try { els.bar.setPointerCapture(e.pointerId); } catch (_) {}
    seekFromEvent(e);
  });
  els.bar.addEventListener("pointermove", function (e) { if (dragging) seekFromEvent(e); });
  function endDrag() { dragging = false; }
  els.bar.addEventListener("pointerup", endDrag);
  els.bar.addEventListener("pointercancel", endDrag);
  els.bar.addEventListener("keydown", function (e) {
    if (loaded !== current) return;
    if (e.key === "ArrowRight") { audio.currentTime = Math.min(duration(), audio.currentTime + 5); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
  });

  els.play.addEventListener("click", toggle);
  els.next.addEventListener("click", next);
  els.prev.addEventListener("click", prev);
  els.vol.addEventListener("input", function () { audio.volume = parseFloat(els.vol.value); });

  audio.addEventListener("timeupdate", updateTime);
  audio.addEventListener("loadedmetadata", updateTime);
  audio.addEventListener("durationchange", updateTime);
  audio.addEventListener("play", updateButton);
  audio.addEventListener("pause", updateButton);
  audio.addEventListener("ended", function () {
    if (current < TRACKS.length - 1) next();
    else { audio.currentTime = 0; updateButton(); updateTime(); }
  });
  audio.addEventListener("error", function () {
    if (loaded === current) setStatus("This track could not be played.");
  });

  // Space bar toggles play/pause when nothing else has focus
  document.addEventListener("keydown", function (e) {
    if ((e.key === " " || e.code === "Space") && e.target === document.body) { e.preventDefault(); toggle(); }
  });

  // Lock-screen / media-key controls
  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    try {
      ms.setActionHandler("play", toggle);
      ms.setActionHandler("pause", toggle);
      ms.setActionHandler("previoustrack", prev);
      ms.setActionHandler("nexttrack", next);
    } catch (_) {}
  }

  // Basic deterrents: no context menu, no dragging of the cover
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });

  buildList();
  render();
  updateButton();
})();
</script>
</body>
</html>
