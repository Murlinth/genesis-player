<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Aird</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#BDE7F6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jacob Music">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FFFFFF; --text:#212121; --head:#BDE7F6; --btn:#BFE6F5; --line:#333333; --on:#3590C4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; max-width: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Roboto", Arial, sans-serif; font-size: 16px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }

  /* Album browser (home view: the grid, nothing else) */
  .albums-wrap { padding: 16px; background: var(--bg); }
  .albums { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .album {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 10px 12px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; box-shadow: none;
    font: 400 .9rem "Roboto", Arial, sans-serif; text-align: center; cursor: pointer;
  }
  @media (hover: hover) { .album:hover { background: #f3fafd; } }
  .thumb {
    display: block; width: 100%; max-width: 130px; aspect-ratio: 1 / 1; object-fit: cover; margin-bottom: 6px;
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
    -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none;
  }
  .album .at { font-family: "Baloo 2", "Roboto", sans-serif; font-weight: 800; font-size: 1.1rem; line-height: 1.15; }
  .album .aa, .album .ac { font-size: .85rem; }

  /* View scaffolding */
  [hidden] { display: none !important; }
  .topbar { max-width: 560px; margin: 0 auto; padding: 12px 16px 0; }
  .backbtn {
    font: 500 .95rem "Roboto", Arial, sans-serif; padding: 9px 16px; cursor: pointer;
    background: var(--btn); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .backbtn:active { background: var(--head); }
  .album-head { max-width: 560px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 14px; align-items: center; }
  .ahead-thumb {
    width: 84px; height: 84px; object-fit: cover; flex: none;
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
    -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none;
  }
  .album-head h2 { font-size: 1.6rem; }
  .album-head p { margin: 2px 0 0; font-size: .95rem; }

  header {
    background: var(--head); border-bottom: 1px solid var(--line);
    padding: 28px 16px 24px; text-align: center;
  }
  .cover {
    display: block; width: min(86vw, 400px); aspect-ratio: 1 / 1; object-fit: cover;
    margin: 0 auto 20px; background: #fff;
    border: 1px solid var(--line); border-radius: 4px;
    -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none;
  }
  .cover.missing, .thumb.missing, .ahead-thumb.missing, #miniCover.missing { color: transparent; }
  .cover.missing, .thumb.missing, .ahead-thumb.missing, #miniCover.missing { visibility: visible; background: #fff; }
  h1, h2 { font-family: "Baloo 2", "Roboto", sans-serif; font-weight: 800; margin: 0; }
  h1 { font-size: clamp(2.2rem, 9vw, 3.3rem); line-height: 1.05; }
  .artist { margin: 6px 0 0; font-size: 1.15rem; }

  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  main.inner { padding-top: 18px; }
  .now { font-size: 1.5rem; line-height: 1.2; text-align: center; margin-bottom: 14px; min-height: 1.8rem; }

  .bar {
    position: relative; height: 20px; background: #fff; cursor: pointer; touch-action: none;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  }
  .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--btn); border-right: 1px solid var(--line); }
  .fill.empty { border-right: 0; }
  .times { display: flex; justify-content: space-between; margin: 6px 0 16px; font-size: .9rem; font-variant-numeric: tabular-nums; }

  .controls { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 480px) {
    .controls { gap: 8px; }
    .btn { min-width: 50px; min-height: 48px; padding: 0 10px; }
    .btn.main { min-width: 78px; }
    .btn svg { width: 21px; height: 21px; }
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 64px; min-height: 52px; padding: 0 16px;
    background: var(--btn); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; box-shadow: none;
    font: 500 1rem "Roboto", Arial, sans-serif; text-align: center; cursor: pointer;
  }
  .btn.main { min-width: 110px; }
  .btn:active { background: var(--head); }
  .btn svg { width: 24px; height: 24px; fill: var(--text); display: block; }
  button:focus-visible, .bar:focus-visible, input:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  .status { min-height: 1.4em; margin: 12px 0 0; text-align: center; font-size: .95rem; }

  .volume { display: flex; align-items: center; gap: 12px; margin: 12px 0 8px; }
  .volume label { font-weight: 500; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  input[type=range]::-moz-range-track { height: 8px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; background: var(--btn); border: 1px solid var(--line); border-radius: 4px; }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; background: var(--btn); border: 1px solid var(--line); border-radius: 4px; }

  h2 { font-size: 1.5rem; margin-bottom: 10px; }
  ol { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  li + li { border-top: 1px solid #cfcfcf; }
  .track {
    display: flex; align-items: center; gap: 4px;
    width: 100%; padding: 8px 12px; min-height: 52px;
    background: #fff; color: var(--text);
  }
  .tmain {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center;
    flex: 1; padding: 6px 0; min-height: 40px;
    background: none; border: 0; box-shadow: none; color: inherit;
    font: 400 1rem "Roboto", Arial, sans-serif; text-align: left; cursor: pointer;
  }
  .track .n, .track .d { font-variant-numeric: tabular-nums; }
  .track .d { font-size: .9rem; }
  .track.playing { background: var(--head); }
  .track.playing .tmain { font-weight: 700; }
  .tmain:focus-visible { outline-offset: -3px; }
  .fav { background: none; border: 0; box-shadow: none; cursor: pointer; padding: 8px; line-height: 0; }
  .fav svg { width: 22px; height: 22px; fill: #c9c9c9; display: block; }
  .fav.on svg { fill: #e0245e; }
  .qadd {
    background: none; border: 0; box-shadow: none; cursor: pointer;
    padding: 8px 10px; font-size: 1.3rem; line-height: 1; color: var(--text); min-width: 40px;
  }
  .qadd.added { color: var(--on); font-weight: 700; }
  .empty-note { padding: 16px 12px; font-size: .95rem; background: #fff; }
  .tracks-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .tracks-head h2 { margin: 0; }
  .chip {
    font: 500 .9rem "Roboto", Arial, sans-serif; padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; background: #fff; color: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--head); font-weight: 700; }
  .btn[aria-pressed="true"] { background: var(--on); color: #fff; border-color: #22719e; }
  .btn[aria-pressed="true"] svg { fill: #fff; }
  #repeat .badge { display: none; font-size: .8rem; font-weight: 700; margin-left: 3px; }
  #repeat.one .badge { display: inline; }
  @media (hover: hover) { .track:not(.playing):hover { background: #f3fafd; } }

  /* Version toggle (Vocal / Instrumental) */
  .version { display: none; justify-content: center; margin-top: 6px; }
  .version.show { display: flex; }
  .version button {
    font: inherit; font-size: .9rem; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: inherit;
  }
  .version button:first-child { border-radius: 999px 0 0 999px; }
  .version button:last-child { border-radius: 0 999px 999px 0; border-left: none; }
  .version button[aria-pressed="true"] { background: var(--head); font-weight: 700; }
  .version button:disabled { opacity: .35; cursor: default; }

  /* Queue (player view, under the controls) */
  .queue-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 10px; }
  .queue-toggle {
    font: 800 1.4rem "Baloo 2", "Roboto", sans-serif; background: none; border: 0; box-shadow: none;
    color: inherit; cursor: pointer; padding: 4px 0;
  }
  .qmain {
    display: grid; grid-template-columns: 1fr; gap: 1px; align-items: center;
    flex: 1; padding: 6px 0; min-height: 40px;
    background: none; border: 0; box-shadow: none; color: inherit;
    font: 400 1rem "Roboto", Arial, sans-serif; text-align: left; cursor: pointer;
  }
  .qmain .qa { font-size: .8rem; opacity: .75; }
  .qx {
    background: none; border: 0; box-shadow: none; cursor: pointer;
    padding: 8px 10px; font-size: 1.05rem; line-height: 1; color: var(--text); min-width: 40px;
  }

  /* Mini now-playing bar (home & album views, while something is loaded) */
  #mini {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    background: var(--head); border-top: 1px solid var(--line); padding: 8px 12px;
  }
  #miniCover { width: 44px; height: 44px; object-fit: cover; flex: none; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  #miniMain {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start;
    background: none; border: 0; box-shadow: none; color: inherit; cursor: pointer;
    font: 400 1rem "Roboto", Arial, sans-serif; text-align: left; padding: 4px 0;
  }
  #miniTitle { font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #miniAlbum { font-size: .85rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #miniPlay { min-width: 54px; min-height: 44px; flex: none; }
  body.has-mini #view-home, body.has-mini #view-album { padding-bottom: 76px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- HOME: album grid only -->
<div id="view-home">
  <div class="albums-wrap">
    <nav class="albums" id="albums" aria-label="Albums"></nav>
  </div>
</div>

<!-- ALBUM: back button + that album's songs -->
<div id="view-album" hidden>
  <div class="topbar">
    <button type="button" class="backbtn" id="albumBack">&#8592; Albums</button>
  </div>
  <div class="album-head">
    <img class="ahead-thumb" id="aheadCover" alt="" draggable="false">
    <div>
      <h2 id="aheadTitle"></h2>
      <p id="aheadMeta"></p>
    </div>
  </div>
  <main class="inner">
    <div class="tracks-head">
      <h2>Tracks</h2>
      <button type="button" class="chip" id="favFilter" aria-pressed="false">&#9829; Favorites</button>
    </div>
    <ol id="list"></ol>
  </main>
</div>

<!-- PLAYER: album art, all controls, queue underneath -->
<div id="view-player" hidden>
  <div class="topbar">
    <button type="button" class="backbtn" id="playerBack">&#8592; Songs</button>
  </div>
  <header>
    <img class="cover" id="cover" alt="" draggable="false">
    <h1 id="title"></h1>
    <p class="artist" id="artist"></p>
  </header>
  <main id="player">
    <h2 class="now" id="now"></h2>

    <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill empty" id="fill"></div>
    </div>
    <div class="times"><span id="cur">0:00</span><span id="tot">0:00</span></div>

    <div class="controls">
      <button class="btn" id="shuffle" aria-label="Shuffle" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.83-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="btn" id="prev" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="btn main" id="play" aria-label="Play">
        <svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
      </button>
      <button class="btn" id="next" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
      </button>
      <button class="btn" id="repeat" aria-label="Repeat: off" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span class="badge">1</span>
      </button>
    </div>
    <div class="version" id="version" role="group" aria-label="Version">
      <button type="button" id="verVocal" aria-pressed="true">Vocal</button>
      <button type="button" id="verInst" aria-pressed="false">Instrumental</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="volume">
      <label for="vol">Volume</label>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div class="queue-head">
      <button type="button" class="queue-toggle" id="queueToggle" aria-expanded="false">Queue <span id="queueCount"></span> <span id="queueCaret">&#9662;</span></button>
      <button type="button" class="chip" id="queueClear">Clear</button>
    </div>
    <ol id="queueList" hidden></ol>
  </main>
</div>

<!-- Mini now-playing bar -->
<div id="mini" hidden>
  <img id="miniCover" alt="" draggable="false">
  <button type="button" id="miniMain">
    <span id="miniTitle"></span>
    <span id="miniAlbum"></span>
  </button>
  <button class="btn" id="miniPlay" aria-label="Play">
    <svg id="miniIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
  </button>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     ALBUMS: to add another album, add one more album(...) entry below.
     album(id, title, artist, coverFile, audioFilePrefix, numberPadding, [[title, "m:ss"], ...])
     e.g. prefix "hs" + padding 2 -> hs01.mp3, hs02.mp3, ...
     --------------------------------------------------------------- */
  function album(id, title, artist, cover, prefix, pad, rows) {
    return {
      id: id, title: title, artist: artist, cover: cover,
      tracks: rows.map(function (r, i) {
        var n = String(i + 1);
        while (n.length < pad) n = "0" + n;
        var p = r[1].split(":");
        return { title: r[0], len: r[1], file: prefix + n + ".mp3", secs: parseInt(p[0], 10) * 60 + parseInt(p[1], 10) };
      })
    };
  }

  var ALBUMS = [
    album("rexburg", "Rexburg", "Jacob Aird", "rb-cover.png", "rb", 2, [
      ["I Just Don\u2019t Get This Game", "6:18"],
      ["Jack of All Trades", "2:25"],
      ["Sparrow", "4:31"],
      ["Esoteric", "3:47"],
      ["Okay With Different", "3:32"],
      ["Farmer Jeff", "7:31"],
      ["Inverse Dimensions", "4:21"],
      ["Cannons from Lower Deck", "3:53"],
      ["Wizard\u2019s Bar", "3:58"]
    ]),
    album("genesis", "Genesis", "Jacob Aird", "cover.png", "track", 1, [
      ["Family Medley", "2:48"],
      ["Light of Christ", "3:06"],
      ["He is the Plan", "4:11"],
      ["All Over Again", "4:06"],
      ["Heaven Medley", "4:51"],
      ["Mother I Love You", "0:56"],
      ["His Kingdom", "2:48"],
      ["Jacob's Lullaby", "3:42"]
    ]),
    album("highschool", "Jacob in Highschool", "Jacob Aird", "hs-cover.png", "hs", 2, [
      ["Mister Macagorian", "1:20"],
      ["Tect Song", "1:25"],
      ["Big Foot", "3:07"],
      ["Tag Wars", "1:13"],
      ["Ghost Boy", "1:31"],
      ["Thanksgiving At My Home", "3:13"],
      ["Wizard\u2019s Bar", "2:36"],
      ["One Last Pawn", "2:29"],
      ["Tank\u2019s Day Off", "0:39"],
      ["Possibilities", "1:34"],
      ["Ardent Breezes", "1:49"],
      ["Linner", "2:55"],
      ["Rise of the Linths", "1:51"],
      ["Pendulum", "3:14"],
      ["Liven\u2019 on Mars", "1:20"],
      ["As the Moon Sets", "1:10"],
      ["Hear It", "3:03"],
      ["I Just Don\u2019t Like Halloween", "1:40"],
      ["Planet", "1:45"],
      ["Christmas Lights", "2:15"],
      ["Doodle Worlds", "1:37"],
      ["The Messenger", "3:48"],
      ["Young at Heart Forever", "3:47"]
    ]),
  ];

  // Cross-album Favorites collection, presented as its own album (built from
  // the visitor's saved hearts; tracks remember which album they came from)
  var FAV_COVER = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23BDE7F6'/%3E%3Cpath d='M50 84C26 65 14 51 14 35 14 23 23 15 33 15c7 0 14 4 17 10 3-6 10-10 17-10 10 0 19 8 19 20 0 16-12 30-36 49z' fill='%23ffffff'/%3E%3C/svg%3E";
  var FAV_ALBUM = { id: "favorites", title: "Favorites", artist: "Jacob Aird", cover: FAV_COVER, tracks: [] };
  ALBUMS.push(FAV_ALBUM);

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    viewHome: $("view-home"), viewAlbum: $("view-album"), viewPlayer: $("view-player"),
    albums: $("albums"), albumBack: $("albumBack"),
    aheadCover: $("aheadCover"), aheadTitle: $("aheadTitle"), aheadMeta: $("aheadMeta"),
    list: $("list"), favFilter: $("favFilter"),
    playerBack: $("playerBack"),
    cover: $("cover"), title: $("title"), artist: $("artist"),
    now: $("now"), bar: $("bar"), fill: $("fill"), cur: $("cur"), tot: $("tot"),
    prev: $("prev"), play: $("play"), next: $("next"), icon: $("icon"),
    status: $("status"), vol: $("vol"),
    version: $("version"), verInst: $("verInst"), verVocal: $("verVocal"),
    shuffle: $("shuffle"), repeat: $("repeat"),
    queueToggle: $("queueToggle"), queueCount: $("queueCount"), queueCaret: $("queueCaret"),
    queueClear: $("queueClear"), queueList: $("queueList"),
    mini: $("mini"), miniCover: $("miniCover"), miniMain: $("miniMain"),
    miniTitle: $("miniTitle"), miniAlbum: $("miniAlbum"),
    miniPlay: $("miniPlay"), miniIcon: $("miniIcon")
  };
  var ICON_PLAY = "M7 4l13 8-13 8z";
  var ICON_PAUSE = "M6 4h4v16H6zM14 4h4v16h-4z";

  var audio = new Audio();          // no controls, never attached to the page
  audio.preload = "auto";
  audio.volume = parseFloat(els.vol.value);

  var cache = {};                   // "albumId:index:file" -> Promise<blob URL>
  var view = "home";                // "home" | "album" | "player"
  var viewAlbumIdx = 0;             // album shown in the album view
  var viewList = [];                // track indices currently shown for VA()
  var queue = [];                   // [{aid, idx}, ...] — temporary, never saved
  var qPos = -1;                    // position in queue of the current song (-1 = none)
  var loadedKey = "";               // "aid:idx" whose blob is in the audio element
  var token = 0;                    // guards against out-of-order loads
  var queueOpen = false;
  var vocalMode = true;             // version toggle state: Vocal is the default; tracks without a vocal version fall back to instrumental automatically
  var VOCAL_FILES = { genesis: { 1: "track2v.mp3", 2: "track3v.mp3", 3: "track4v.mp3", 7: "track8v.mp3" } };
  var INST_FILES = { rexburg: { 0: "rb01i.mp3", 1: "rb02i.mp3", 2: "rb03i.mp3", 8: "rb09i.mp3" } };

  // Shuffle / repeat / favorites — favorites and mode choices live in this
  // browser only (localStorage); there is no account and no cross-device sync.
  // The queue is deliberately NOT saved: it starts empty on every visit.
  var shuffleOn = false;
  var repeatMode = 0;               // 0 = off, 1 = repeat all, 2 = repeat one
  var favFilter = false;
  var favorites = {};               // albumId -> [trackIndex, ...]
  try {
    favorites = JSON.parse(localStorage.getItem("gp-favorites") || "{}") || {};
    shuffleOn = localStorage.getItem("gp-shuffle") === "1";
    repeatMode = parseInt(localStorage.getItem("gp-repeat") || "0", 10) || 0;
  } catch (_) {}
  function savePrefs() {
    try {
      localStorage.setItem("gp-favorites", JSON.stringify(favorites));
      localStorage.setItem("gp-shuffle", shuffleOn ? "1" : "0");
      localStorage.setItem("gp-repeat", String(repeatMode));
    } catch (_) {}
  }
  function isFav(aid, i) { return (favorites[aid] || []).indexOf(i) !== -1; }
  var favCountEl = null;            // the Favorites album card's track-count label
  function refreshFavoritesAlbum() {
    FAV_ALBUM.tracks = [];
    ALBUMS.forEach(function (a) {
      if (a.id === "favorites") return;
      (favorites[a.id] || []).slice().sort(function (x, y) { return x - y; }).forEach(function (i) {
        var t = a.tracks[i];
        if (t) FAV_ALBUM.tracks.push({ title: t.title, len: t.len, secs: t.secs, file: t.file, srcAlbum: a.id, srcIndex: i });
      });
    });
    if (favCountEl) favCountEl.textContent = FAV_ALBUM.tracks.length + (FAV_ALBUM.tracks.length === 1 ? " track" : " tracks");
  }
  function albumById(id) {
    for (var i = 0; i < ALBUMS.length; i++) if (ALBUMS[i].id === id) return ALBUMS[i];
    return null;
  }
  function VA() { return ALBUMS[viewAlbumIdx]; }
  // A queue/list reference always points at a real album track (Favorites
  // entries resolve back to the album the song came from)
  function refFor(a, i) {
    if (a.id === "favorites") { var t = a.tracks[i]; return { aid: t.srcAlbum, idx: t.srcIndex }; }
    return { aid: a.id, idx: i };
  }
  function refsEqual(r1, r2) { return !!r1 && !!r2 && r1.aid === r2.aid && r1.idx === r2.idx; }
  function curRef() { return qPos >= 0 && qPos < queue.length ? queue[qPos] : null; }
  function curKey() { var r = curRef(); return r ? r.aid + ":" + r.idx : ""; }
  function curTrack() { var r = curRef(); var a = r ? albumById(r.aid) : null; return a ? a.tracks[r.idx] : null; }

  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function setStatus(msg) { els.status.textContent = msg || ""; }

  // Which versions exist for a track: paired tracks have both; in an album
  // that has any paired tracks, an unpaired track is an instrumental piece
  // with no vocal version, so its Vocal button is disabled and faded.
  function trackVersions(a, i) {
    var paired = !!((VOCAL_FILES[a.id] && VOCAL_FILES[a.id][i]) || (INST_FILES[a.id] && INST_FILES[a.id][i]));
    if (paired) return { vocal: true, inst: true };
    if (VOCAL_FILES[a.id] || INST_FILES[a.id]) return { vocal: false, inst: true };
    return { vocal: false, inst: false };
  }
  function updateVersionButtons() {
    var r = curRef();
    if (!r) return;
    var a = albumById(r.aid);
    var v = trackVersions(a, r.idx);
    els.verVocal.disabled = !v.vocal;
    els.verInst.disabled = !v.inst;
    var effVocal = vocalMode && v.vocal;
    els.verInst.setAttribute("aria-pressed", effVocal ? "false" : "true");
    els.verVocal.setAttribute("aria-pressed", effVocal ? "true" : "false");
  }

  function effFile(a, i) {
    if (vocalMode && VOCAL_FILES[a.id] && VOCAL_FILES[a.id][i]) return VOCAL_FILES[a.id][i];
    if (!vocalMode && INST_FILES[a.id] && INST_FILES[a.id][i]) return INST_FILES[a.id][i];
    return a.tracks[i].file;
  }

  // Fetch the MP3 and hand the player a blob URL so the file URL is not exposed in the page.
  function getUrl(a, i) {
    var file = effFile(a, i);
    var key = a.id + ":" + i + ":" + file;
    if (!cache[key]) {
      var p = fetch(file)
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.blob();
        })
        .then(function (b) {
          return URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }));
        });
      p.catch(function () { delete cache[key]; });
      cache[key] = p;
    }
    return cache[key];
  }

  // Images: a missing file leaves a plain empty frame instead of a broken-image icon
  function setImage(img, src) {
    img.classList.remove("missing");
    img.src = src;
  }
  function watchImage(img) {
    img.addEventListener("error", function () { img.classList.add("missing"); img.removeAttribute("alt"); });
  }

  /* ---------------- Views ---------------- */
  function showView(name) {
    view = name;
    els.viewHome.hidden = name !== "home";
    els.viewAlbum.hidden = name !== "album";
    els.viewPlayer.hidden = name !== "player";
    window.scrollTo(0, 0);
    renderMini();
  }
  function openAlbum(i) {
    viewAlbumIdx = i;
    if (VA().id === "favorites") refreshFavoritesAlbum();
    buildAlbumView();
    showView("album");
  }

  function buildAlbums() {
    ALBUMS.forEach(function (a, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "album";
      b.innerHTML = '<img class="thumb" alt="" draggable="false"><span class="at"></span><span class="aa"></span><span class="ac"></span>';
      var img = b.querySelector(".thumb");
      watchImage(img);
      setImage(img, a.cover);
      b.querySelector(".at").textContent = a.title;
      b.querySelector(".aa").textContent = a.artist;
      b.querySelector(".ac").textContent = a.tracks.length + (a.tracks.length === 1 ? " track" : " tracks");
      if (a.id === "favorites") favCountEl = b.querySelector(".ac");
      b.addEventListener("click", function () { openAlbum(i); });
      els.albums.appendChild(b);
    });
  }

  function buildAlbumView() {
    var a = VA();
    setImage(els.aheadCover, a.cover);
    els.aheadCover.alt = a.title + " album cover";
    els.aheadTitle.textContent = a.title;
    els.aheadMeta.textContent = a.artist + " \u00B7 " + a.tracks.length + (a.tracks.length === 1 ? " track" : " tracks");
    els.favFilter.style.display = a.id === "favorites" ? "none" : "";
    buildList();
  }

  function buildList() {
    els.list.innerHTML = "";
    viewList = [];
    VA().tracks.forEach(function (t, i) {
      if (VA().id === "favorites" || !favFilter || isFav(VA().id, i)) viewList.push(i);
    });
    if (!viewList.length) {
      var li0 = document.createElement("li");
      li0.className = "empty-note";
      li0.textContent = VA().id === "favorites"
        ? "No favorites yet \u2014 tap a heart on any song, in any album, and it will show up here."
        : "No favorites in this album yet \u2014 tap a heart to add one.";
      els.list.appendChild(li0);
      return;
    }
    viewList.forEach(function (i) {
      var t = VA().tracks[i];
      var li = document.createElement("li");
      var row = document.createElement("div");
      row.className = "track";
      row.setAttribute("data-idx", i);
      var main = document.createElement("button");
      main.type = "button";
      main.className = "tmain";
      main.innerHTML = '<span class="n"></span><span class="t"></span><span class="d"></span>';
      main.children[0].textContent = i + 1;
      main.children[1].textContent = t.title;
      main.children[2].textContent = t.len;
      main.addEventListener("click", function () { playFromAlbum(VA(), i); });
      var fav = document.createElement("button");
      fav.type = "button";
      fav.className = "fav";
      fav.setAttribute("aria-label", "Favorite: " + t.title);
      fav.setAttribute("aria-pressed", "false");
      fav.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3z"/></svg>';
      fav.addEventListener("click", function () { toggleFav(i); });
      var add = document.createElement("button");
      add.type = "button";
      add.className = "qadd";
      add.textContent = "+";
      add.setAttribute("aria-label", "Add to queue: " + t.title);
      add.addEventListener("click", function () {
        addToQueue(VA(), i);
        add.textContent = "\u2713";
        add.classList.add("added");
        setTimeout(function () { add.textContent = "+"; add.classList.remove("added"); }, 1200);
      });
      row.appendChild(main);
      row.appendChild(fav);
      row.appendChild(add);
      li.appendChild(row);
      els.list.appendChild(li);
    });
    renderFavs();
    renderListStates();
  }

  function toggleFav(i) {
    var t = VA().tracks[i];
    var aid = t && t.srcAlbum ? t.srcAlbum : VA().id;
    var ti = t && t.srcAlbum ? t.srcIndex : i;
    var arr = favorites[aid] || (favorites[aid] = []);
    var k = arr.indexOf(ti);
    if (k === -1) arr.push(ti); else arr.splice(k, 1);
    savePrefs();
    refreshFavoritesAlbum();
    if (VA().id === "favorites") buildList();
    else if (favFilter) buildList();
    renderFavs();
  }
  function renderFavs() {
    var rows = els.list.querySelectorAll(".track");
    for (var r = 0; r < rows.length; r++) {
      var idx = +rows[r].getAttribute("data-idx");
      var t = VA().tracks[idx];
      var on = t && t.srcAlbum ? isFav(t.srcAlbum, t.srcIndex) : isFav(VA().id, idx);
      var f = rows[r].querySelector(".fav");
      if (f) { f.classList.toggle("on", on); f.setAttribute("aria-pressed", on ? "true" : "false"); }
    }
  }
  function renderModes() {
    els.shuffle.setAttribute("aria-pressed", shuffleOn ? "true" : "false");
    els.repeat.setAttribute("aria-pressed", repeatMode ? "true" : "false");
    els.repeat.classList.toggle("one", repeatMode === 2);
    els.repeat.setAttribute("aria-label", "Repeat: " + (repeatMode === 2 ? "one" : repeatMode === 1 ? "all" : "off"));
    els.favFilter.setAttribute("aria-pressed", favFilter ? "true" : "false");
  }
  function renderListStates() {
    var r = curRef();
    var rows = els.list.querySelectorAll(".track");
    for (var k = 0; k < rows.length; k++) {
      var idx = +rows[k].getAttribute("data-idx");
      var on = !!r && refsEqual(r, refFor(VA(), idx));
      rows[k].classList.toggle("playing", on);
      if (on) rows[k].setAttribute("aria-current", "true");
      else rows[k].removeAttribute("aria-current");
    }
  }

  /* ---------------- Queue ---------------- */
  function playFromAlbum(a, i) {
    var pos = viewList.indexOf(i);
    if (pos === -1) pos = 0;
    queue = viewList.slice(pos).map(function (vi) { return refFor(a, vi); });
    qPos = 0;
    showView("player");
    playQueuePos(0, true);
  }
  function addToQueue(a, i) {
    queue.push(refFor(a, i));
    if (qPos === -1) { qPos = 0; playQueuePos(0, false); }
    renderQueue();
    renderMini();
  }
  function removeFromQueue(p) {
    var wasPlaying = !audio.paused;
    if (p < qPos) { queue.splice(p, 1); qPos--; }
    else if (p > qPos) { queue.splice(p, 1); }
    else {
      queue.splice(p, 1);
      if (!queue.length) {
        stopAll();
        showView("album");
        renderQueue();
        return;
      }
      if (qPos >= queue.length) qPos = queue.length - 1;
      playQueuePos(qPos, wasPlaying);
    }
    renderQueue();
    renderPlayer();
  }
  function clearQueue() {
    var r = curRef();
    queue = r ? [r] : [];
    qPos = r ? 0 : -1;
    renderQueue();
  }
  function stopAll() {
    token++;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    loadedKey = "";
    qPos = -1;
    setStatus("");
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = null;
    renderPlayer();
    renderMini();
  }
  function renderQueue() {
    els.queueCount.textContent = queue.length ? "(" + queue.length + ")" : "";
    els.queueCaret.textContent = queueOpen ? "\u25B4" : "\u25BE";
    els.queueToggle.setAttribute("aria-expanded", queueOpen ? "true" : "false");
    els.queueList.hidden = !queueOpen;
    if (!queueOpen) return;
    els.queueList.innerHTML = "";
    if (!queue.length) {
      var li0 = document.createElement("li");
      li0.className = "empty-note";
      li0.textContent = "The queue is empty \u2014 tap + on any song, in any album, to add it here.";
      els.queueList.appendChild(li0);
      return;
    }
    queue.forEach(function (r, p) {
      var a = albumById(r.aid);
      var t = a ? a.tracks[r.idx] : null;
      if (!t) return;
      var li = document.createElement("li");
      var row = document.createElement("div");
      row.className = "track" + (p === qPos ? " playing" : "");
      var main = document.createElement("button");
      main.type = "button";
      main.className = "qmain";
      main.innerHTML = '<span class="t"></span><span class="qa"></span>';
      main.children[0].textContent = t.title;
      main.children[1].textContent = a.title;
      main.addEventListener("click", function () { playQueuePos(p, true); });
      var x = document.createElement("button");
      x.type = "button";
      x.className = "qx";
      x.textContent = "\u2715";
      x.setAttribute("aria-label", "Remove from queue: " + t.title);
      x.addEventListener("click", function () { removeFromQueue(p); });
      row.appendChild(main);
      row.appendChild(x);
      li.appendChild(row);
      els.queueList.appendChild(li);
    });
  }

  /* ---------------- Playback ---------------- */
  function playQueuePos(p, autoplay) {
    var r = queue[p];
    if (!r) return;
    var a = albumById(r.aid);
    if (!a) return;
    var my = ++token;
    qPos = p;
    audio.pause();
    loadedKey = "";
    renderPlayer();
    updateButton();
    setStatus("Loading\u2026");
    getUrl(a, r.idx).then(function (url) {
      if (my !== token) return;
      audio.src = url;
      loadedKey = r.aid + ":" + r.idx;
      setStatus("");
      updateTime();
      renderPlayer();
      if ("mediaSession" in navigator && window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: a.tracks[r.idx].title, artist: a.artist, album: a.title
        });
      }
      var nr = queue[p + 1];   // warm the next song in the queue
      if (nr) { var na = albumById(nr.aid); if (na) getUrl(na, nr.idx).catch(function () {}); }
      if (autoplay) return audio.play();
    }).catch(function (e) {
      if (my !== token) return;
      if (e && e.name === "AbortError") return;
      if (e && e.name === "NotAllowedError") { setStatus("Press play to start."); updateButton(); return; }
      setStatus("This track could not be loaded. Check that " + a.tracks[r.idx].file + " is in the same folder and the page is served from a web server.");
      updateButton();
    });
  }
  function toggle() {
    if (!curRef()) return;
    if (loadedKey !== curKey()) { playQueuePos(qPos, true); return; }
    if (audio.paused) audio.play().catch(function () {});
    else audio.pause();
  }
  // Next position in the queue, honoring shuffle and repeat-all; -1 = stop
  function pickNext() {
    if (!queue.length) return -1;
    if (shuffleOn && queue.length > 1) {
      var n;
      do { n = Math.floor(Math.random() * queue.length); } while (n === qPos);
      return n;
    }
    if (qPos < queue.length - 1) return qPos + 1;
    if (repeatMode === 1) return 0;
    return -1;
  }
  function next() {
    var n = pickNext();
    if (n === -1) return;
    if (n === qPos) { audio.currentTime = 0; audio.play().catch(function () {}); return; }
    playQueuePos(n, true);
  }
  function prev() {
    if (loadedKey === curKey() && audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (qPos > 0) playQueuePos(qPos - 1, true);
    else if (loadedKey === curKey()) audio.currentTime = 0;
  }

  // Version toggle: flips state; if the current track has the other version,
  // swap the audio source, restore position, and resume.
  function setVocalMode(on) {
    vocalMode = on;
    els.verInst.setAttribute("aria-pressed", on ? "false" : "true");
    els.verVocal.setAttribute("aria-pressed", on ? "true" : "false");
    var r = curRef();
    if (!r || loadedKey !== curKey()) return;
    var a = albumById(r.aid);
    if (!(VOCAL_FILES[a.id] && VOCAL_FILES[a.id][r.idx]) && !(INST_FILES[a.id] && INST_FILES[a.id][r.idx])) return;
    var t = audio.currentTime;
    var wasPlaying = !audio.paused;
    var my = ++token;
    getUrl(a, r.idx).then(function (url) {
      if (my !== token) return;
      audio.src = url;
      var restore = function () {
        try { audio.currentTime = t; } catch (_) {}
        audio.removeEventListener("loadedmetadata", restore);
        if (wasPlaying) audio.play();
      };
      audio.addEventListener("loadedmetadata", restore);
    }).catch(function () {});
  }

  /* ---------------- Rendering ---------------- */
  function renderPlayer() {
    var r = curRef();
    var a = r ? albumById(r.aid) : null;
    var t = a ? a.tracks[r.idx] : null;
    if (!t) {
      els.now.textContent = "";
      updateTime();
      renderListStates();
      renderQueue();
      return;
    }
    setImage(els.cover, a.cover);
    els.cover.alt = a.title + " album cover";
    els.title.textContent = a.title;
    els.artist.textContent = a.artist;
    els.now.textContent = t.title;
    document.title = t.title + " \u2013 " + a.title + " \u2013 " + a.artist;
    els.version.classList.toggle("show", !!(VOCAL_FILES[a.id] || INST_FILES[a.id]));
    updateVersionButtons();
    updateTime();
    renderListStates();
    renderQueue();
    renderMini();
  }
  function renderMini() {
    var r = curRef();
    var show = !!r && view !== "player";
    els.mini.hidden = !show;
    document.body.classList.toggle("has-mini", show);
    if (!show) return;
    var a = albumById(r.aid);
    setImage(els.miniCover, a.cover);
    els.miniTitle.textContent = a.tracks[r.idx].title;
    els.miniAlbum.textContent = a.title;
  }
  function duration() {
    var t = curTrack();
    if (!t) return 0;
    if (loadedKey === curKey() && isFinite(audio.duration) && audio.duration > 0) return audio.duration;
    return t.secs;
  }
  function updateTime() {
    var pos = loadedKey === curKey() ? audio.currentTime : 0;
    var dur = duration();
    var pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;
    els.fill.style.width = pct + "%";
    els.fill.classList.toggle("empty", pct <= 0);
    els.cur.textContent = fmt(pos);
    els.tot.textContent = fmt(dur);
    els.bar.setAttribute("aria-valuenow", Math.round(pct));
    els.bar.setAttribute("aria-valuetext", fmt(pos) + " of " + fmt(dur));
  }
  function updateButton() {
    var playing = !!curRef() && !audio.paused && loadedKey === curKey();
    els.icon.firstElementChild.setAttribute("d", playing ? ICON_PAUSE : ICON_PLAY);
    els.play.setAttribute("aria-label", playing ? "Pause" : "Play");
    els.miniIcon.firstElementChild.setAttribute("d", playing ? ICON_PAUSE : ICON_PLAY);
    els.miniPlay.setAttribute("aria-label", playing ? "Pause" : "Play");
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
  }

  /* ---------------- Seeking ---------------- */
  function seekFromEvent(e) {
    if (loadedKey !== curKey()) return;
    var r = els.bar.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    audio.currentTime = ratio * duration();
    updateTime();
  }
  var dragging = false;
  els.bar.addEventListener("pointerdown", function (e) {
    dragging = true;
    try { els.bar.setPointerCapture(e.pointerId); } catch (_) {}
    seekFromEvent(e);
  });
  els.bar.addEventListener("pointermove", function (e) { if (dragging) seekFromEvent(e); });
  function endDrag() { dragging = false; }
  els.bar.addEventListener("pointerup", endDrag);
  els.bar.addEventListener("pointercancel", endDrag);
  els.bar.addEventListener("keydown", function (e) {
    if (loadedKey !== curKey()) return;
    if (e.key === "ArrowRight") { audio.currentTime = Math.min(duration(), audio.currentTime + 5); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
  });

  /* ---------------- Wiring ---------------- */
  els.albumBack.addEventListener("click", function () { showView("home"); });
  els.playerBack.addEventListener("click", function () {
    var r = curRef();
    if (r) {
      for (var i = 0; i < ALBUMS.length; i++) if (ALBUMS[i].id === r.aid) viewAlbumIdx = i;
    }
    buildAlbumView();
    showView("album");
  });
  els.play.addEventListener("click", toggle);
  els.next.addEventListener("click", next);
  els.prev.addEventListener("click", prev);
  els.miniPlay.addEventListener("click", toggle);
  els.miniMain.addEventListener("click", function () { showView("player"); });
  els.vol.addEventListener("input", function () { audio.volume = parseFloat(els.vol.value); });
  els.verInst.addEventListener("click", function () { setVocalMode(false); });
  els.verVocal.addEventListener("click", function () { setVocalMode(true); });
  els.shuffle.addEventListener("click", function () { shuffleOn = !shuffleOn; savePrefs(); renderModes(); });
  els.repeat.addEventListener("click", function () { repeatMode = (repeatMode + 1) % 3; savePrefs(); renderModes(); });
  els.favFilter.addEventListener("click", function () { favFilter = !favFilter; buildList(); renderModes(); });
  els.queueToggle.addEventListener("click", function () { queueOpen = !queueOpen; renderQueue(); });
  els.queueClear.addEventListener("click", clearQueue);

  audio.addEventListener("timeupdate", updateTime);
  audio.addEventListener("loadedmetadata", updateTime);
  audio.addEventListener("durationchange", updateTime);
  audio.addEventListener("play", updateButton);
  audio.addEventListener("pause", updateButton);
  audio.addEventListener("ended", function () {
    if (repeatMode === 2 && curRef()) { audio.currentTime = 0; audio.play().catch(function () {}); return; }
    var n = pickNext();
    if (n === -1) { audio.currentTime = 0; updateButton(); updateTime(); return; }
    if (n === qPos) { audio.currentTime = 0; audio.play().catch(function () {}); return; }
    playQueuePos(n, true);
  });
  audio.addEventListener("error", function () {
    if (loadedKey === curKey() && audio.getAttribute("src")) setStatus("This track could not be played.");
  });

  // Space bar toggles play/pause when nothing else has focus
  document.addEventListener("keydown", function (e) {
    if ((e.key === " " || e.code === "Space") && e.target === document.body) { e.preventDefault(); toggle(); }
  });

  // Lock-screen / media-key controls
  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    try {
      ms.setActionHandler("play", toggle);
      ms.setActionHandler("pause", toggle);
      ms.setActionHandler("previoustrack", prev);
      ms.setActionHandler("nexttrack", next);
    } catch (_) {}
  }

  // Basic deterrents: no context menu, no dragging of images
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });

  watchImage(els.cover);
  watchImage(els.aheadCover);
  watchImage(els.miniCover);
  refreshFavoritesAlbum();
  buildAlbums();
  buildAlbumView();
  renderModes();
  showView("home");
  updateButton();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
